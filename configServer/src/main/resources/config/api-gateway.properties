spring.application.name=api-gateway
server.port=8080

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://keycloak:8080/realms/fitness-oauth2/protocol/openid-connect/certs}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_URL:http://eureka:8761/eureka/}}
eureka.instance.prefer-ip-address=true

# User Service Route
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

# Activity Service Route
spring.cloud.gateway.server.webflux.routes[1].id=activity-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ACTIVITY-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/activities/**

# Ai Service Route
spring.cloud.gateway.server.webflux.routes[2].id=ai-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://AI-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/recommendations/**

# Community service
spring.cloud.gateway.server.webflux.routes[3].id=community-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://COMMUNITY-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/community/**

# Python ML service (local development; override with ML_SERVICE_URL in deployment)
spring.cloud.gateway.server.webflux.routes[4].id=ml-service
spring.cloud.gateway.server.webflux.routes[4].uri=${ML_SERVICE_URL:http://ml-service:8090}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/ml/**
