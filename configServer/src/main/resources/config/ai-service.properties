spring.application.name=ai-service
server.port=8083

# MongoDB
spring.data.mongodb.uri=${SPRING_MONGODB_URI:${AI_MONGODB_URI:mongodb://mongodb:27017/fitness_recommendation}}
spring.mongodb.uri=${SPRING_MONGODB_URI:${AI_MONGODB_URI:mongodb://mongodb:27017/fitness_recommendation}}
spring.mongodb.database=fitness_recommendation

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:${EUREKA_URL:http://eureka:8761/eureka/}}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:rabbitmq}}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

rabbitmq.queue.name=activity.queue
rabbitmq.exchange.name=activity.exchange
rabbitmq.routing.key=activity.created

# Gemini
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:}
